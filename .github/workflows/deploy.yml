name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh build-time calendar events every Tuesday at noon in Germany.
    # Europe/Berlin keeps noon local through CET/CEST changes.
    - cron: "0 12 * * 2"
      timezone: "Europe/Berlin"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Re-read Tibia.com's official calendar and commit the capture the build publishes.
      # The calendar sits behind a Cloudflare challenge that usually refuses an unattended
      # runner, in which case the script leaves the committed capture untouched and the
      # build publishes that instead. Refresh it by hand from a machine that can load the
      # page: `npm run calendar:refresh`, then commit lib/data/officialCalendar.json.
      - name: Refresh the official calendar capture
        run: npm run calendar:refresh
      - name: Commit a refreshed capture
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- lib/data/officialCalendar.json; then
            echo "Official calendar capture unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/officialCalendar.json
          git commit -m "Refresh the official Tibia calendar capture"
          git push
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
